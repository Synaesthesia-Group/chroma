name: chroma-examples

# Replaces the coverage upstream's own build.yml workflow used to provide.
# build.yml is disabled on this fork because its Test jobs clone
# imgui_test_engine at `master`, which does not compile against the
# v1.92.9b-docking baseline this fork tracks. This job builds three of
# upstream's own example applications, unmodified, against the SDL3,
# SDL_GPU3, SDL_Renderer3 and GLFW+OpenGL3 backends Chroma cares about, on
# every operating system Dear ImGui itself supports. See
# .github/chroma/examples/CMakeLists.txt for how each one is built.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: Examples build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            glfw: true
          - os: windows-latest
            glfw: false
          - os: macos-latest
            glfw: true
    steps:
      - name: Check out chroma
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install SDL3 and GLFW build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev libdecor-0-dev libglfw3-dev

      - name: Install GLFW (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install glfw
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0

      - name: Configure examples project
        run: >
          cmake -S .github/chroma/examples -B build/chroma-examples -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCHROMA_BACKEND_SDL3=ON
          -DCHROMA_BACKEND_SDLGPU3=ON
          -DCHROMA_BACKEND_SDLRENDERER3=ON
          -DCHROMA_BACKEND_GLFW_OPENGL3=${{ matrix.glfw && 'ON' || 'OFF' }}

      - name: Build examples project
        run: cmake --build build/chroma-examples
