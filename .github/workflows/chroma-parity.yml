name: chroma-parity

# Checks the "superset, never diverge" rule from ADR-0002 for what this job
# actually proves: with every CHROMA_* flag OFF, the five core translation
# units (imgui.cpp, imgui_draw.cpp, imgui_tables.cpp, imgui_widgets.cpp,
# imgui_demo.cpp) preprocess to byte-identical output against upstream Dear
# ImGui at the tag pinned in scripts/chroma/upstream_tag.txt, and the three
# public headers (imgui.h, imgui_internal.h, imconfig.h) are line supersets
# of upstream's. The job also configures and builds the root
# CMakeLists.txt core library with all CHROMA_* options off.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parity:
    name: Parity check (flags off)
    runs-on: ubuntu-latest
    steps:
      - name: Check out chroma
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: git fetch https://github.com/ocornut/imgui.git '+refs/tags/*:refs/tags/*'

      - name: Run parity check
        run: scripts/chroma/parity_check.sh

      - name: Configure core library (all CHROMA_* options OFF)
        run: >
          cmake -S . -B build/chroma-parity
          -DCHROMA_BACKEND_SDL3=OFF
          -DCHROMA_BACKEND_SDLGPU3=OFF
          -DCHROMA_BACKEND_SDLRENDERER3=OFF
          -DCHROMA_BACKEND_GLFW_OPENGL3=OFF
          -DCHROMA_FREETYPE=OFF
          -DCHROMA_STB_TRUETYPE=OFF

      - name: Build core library
        run: cmake --build build/chroma-parity --target imgui
